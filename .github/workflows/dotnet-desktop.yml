name: .NET Core Desktop

on:
  push:
    branches: [ "master", "ci-1" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild CodeWalker.sln /t:Restore

    - name: Build
      run: msbuild CodeWalker.sln ^
        /p:Configuration=${{ matrix.configuration }} ^
        /p:Platform=${{ matrix.platform }} ^
        /m