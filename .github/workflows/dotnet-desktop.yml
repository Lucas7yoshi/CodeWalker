name: .NET Core Desktop

on:
  push:
    branches: [ "master", "ci-1" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild CodeWalker.sln /t:Restore

    - name: Build
      run: msbuild CodeWalker.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

    - name: Package
      run: |
        mkdir dist
        xcopy .\CodeWalker\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.ErrorReport\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.Gen9Converter\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.ModManager\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.Peds\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.RPFExplorer\bin\${{ matrix.configuration }}\net48 dist /E /Y
        xcopy .\CodeWalker.Vehicles\bin\${{ matrix.configuration }}\net48 dist /E /Y
        mkdir dist\Shaders
        xcopy .\Shaders dist\Shaders /E /Y
        mkdir dist\icons
        xcopy .\icons dist\icons /E /Y

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeWalker_${{ matrix.configuration }}_${{ matrix.platform }}_${{ github.sha }}
        path: dist
        retention-days: 7